name: Build GZDoom Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK r27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          chmod +x build_native.sh
          ./build_native.sh

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :doom:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: gzdoom-android-debug
          path: doom/build/outputs/apk/debug/*.apk
